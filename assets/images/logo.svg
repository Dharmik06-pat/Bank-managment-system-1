<?xml version="1.0" encoding="UTF-8"?>
<!--
  SecureBank logo mark.
  A classical bank facade inside a rounded tile. Kept to bold, simple
  shapes on purpose: this file is also the favicon, so it has to stay
  legible at 16 x 16 pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="SecureBank logo">

  <title>SecureBank</title>

  <defs>
    <!-- Deep navy through to royal blue, matching the site palette -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1c3d"/>
      <stop offset="55%"  stop-color="#1b3a8f"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- A soft highlight across the top-left corner -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>

  <!-- Bank facade, drawn in one white group -->
  <g fill="#ffffff">

    <!-- Pediment (the roof) -->
    <path d="M32 12.5 51.5 24v3.4h-39V24L32 12.5Z"/>

    <!-- Columns -->
    <rect x="17.5" y="30.5" width="5"   height="15" rx="1.4"/>
    <rect x="29.5" y="30.5" width="5"   height="15" rx="1.4"/>
    <rect x="41.5" y="30.5" width="5"   height="15" rx="1.4"/>

    <!-- Plinth -->
    <rect x="12.5" y="48.5" width="39" height="4.6" rx="1.8"/>
  </g>

  <!-- Keyhole in the pediment: the small nod to "secure" -->
  <circle cx="32" cy="21.5" r="2.6" fill="#0b1c3d"/>
</svg>
